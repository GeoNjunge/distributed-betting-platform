syntax = "proto3";

package risk_engine.v1;

// Optional Protocol Buffer equivalent of the JSON schemas. The implemented
// transport in this microservice is JSON so operators can inspect messages with
// kafka-console-consumer, but these definitions document the same strict shape
// for teams that later switch serialization formats.
message BetSubmitted {
  string event_id = 1;
  string bet_id = 2;
  string account_id = 3;
  string idempotency_key = 4;
  string match_id = 5;
  string market_id = 6;
  string selection_id = 7;
  int64 stake_cents = 8;
  int64 potential_payout_cents = 9;
  string odds = 10;
  int64 bet_timestamp_ms = 11;
}

message BetResult {
  string event_id = 1;
  string bet_id = 2;
  string account_id = 3;
  string idempotency_key = 4;
  string match_id = 5;
  string selection_id = 6;
  int64 stake_cents = 7;
  string odds = 8;
  bool accepted = 9;
  string reason_code = 10;
  string reason = 11;
  int64 accepted_exposure_cents = 12;
  int64 remaining_balance_cents = 13;
  int64 decision_timestamp_ms = 14;
}
