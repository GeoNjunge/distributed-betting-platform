services:
  postgres:
    image: postgres:16-alpine
    container_name: betting_postgres
    environment:
      POSTGRES_DB: betting_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d betting_db || pg_isready -U postgres -d betting"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: betting_kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  risk-engine:
    build:
      context: ./risk_engine
      dockerfile: Dockerfile
    container_name: risk_engine
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - BETS_SUBMITTED_TOPIC=bets-submitted
      - BETS_RESULTS_TOPIC=bets-results
      - KAFKA_GROUP_ID=risk-engine-v1
      - SAEC_CAP_CENTS=1000000
      - DEMO_BALANCE_CENTS=100000
      - RISK_BALANCE_SEEDS=dd3e8d4a-951f-5c9c-b6ea-25ee499f1acd:10000,demo-account:100000
    depends_on:
      kafka:
        condition: service_healthy

  ingress-service:
    build:
      context: ./ingress_service
      dockerfile: Dockerfile
    container_name: ingress_service
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - BETS_SUBMITTED_TOPIC=bets-submitted
      - COOKIE_SECURE=false
      - JWT_SECRET_KEY=distributed-betting-platform-secure-jwt-secret-key-32chars
      - CORS_ALLOW_ORIGINS=http://localhost:4200,http://127.0.0.1:4200
      - PYTHONUNBUFFERED=1
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  odds-service:
    build:
      context: ./odds_service
      dockerfile: Dockerfile
    container_name: odds_service
    ports:
      - "8001:8001"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ODDS_UPDATES_TOPIC=odds-updates
      - PYTHONUNBUFFERED=1
    depends_on:
      kafka:
        condition: service_healthy

  odds-simulator:
    build:
      context: ./odds_service
      dockerfile: Dockerfile
    container_name: odds_simulator
    command: ["python", "simulator.py"]
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ODDS_UPDATES_TOPIC=odds-updates
      - PYTHONUNBUFFERED=1
    depends_on:
      kafka:
        condition: service_healthy

  settlement-api:
    build:
      context: ./settlement_service
      dockerfile: Dockerfile
    container_name: settlement_api
    ports:
      - "8002:8002"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/betting_db
      - BETS_RESULTS_TOPIC=bets-results
      - PYTHONUNBUFFERED=1
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  settlement-worker:
    build:
      context: ./settlement_service
      dockerfile: Dockerfile
    container_name: settlement_worker
    command: ["python", "-m", "app.worker"]
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/betting_db
      - BETS_RESULTS_TOPIC=bets-results
      - KAFKA_CONSUMER_GROUP=settlement-service-v1
      - PYTHONUNBUFFERED=1
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
        